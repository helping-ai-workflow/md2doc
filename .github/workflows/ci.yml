name: CI

# Runs once per pull request. main is protected: a PR can only merge when this
# check (and the browser job) is green and the branch is up to date with main,
# so a merge lands exactly the tree that was tested. Pushes to main and the
# release tag do not re-run the suite (v3.12.1 ran npm test four times).
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci || npm install

      - name: Test
        run: npm test
