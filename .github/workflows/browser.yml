name: browser

# Reader click-through checks (test/reader-click.test.js) in Chromium and WebKit —
# the engine of iPhone Safari / Files / LINE previews. Runs only when something
# that shapes the reading page can change, like tripwork's browser.yml.
# Every pull request, no path filter: this is a required check on main, and a
# path-filtered required check never reports on a PR that does not touch those
# paths, which would block the merge. It runs beside the CI job (about 14 min
# against 39), so it adds no wall-clock time. A PR that only changes README.md,
# CLAUDE.md or docs/** skips every step after the scope check and reports
# success (.github/docs-only.sh).
on:
  pull_request:
  workflow_dispatch:

jobs:
  click:
    # Pinned, not ubuntu-latest: the label moved to Ubuntu 26.04 in October 2026
    # and the cached WebKit (built for 24.04) could not start there for want of
    # libicudata.so.74 (PR #54). The CI WebKit budget in wave-canvas.test.js was
    # also measured on 24.04. Move this on purpose, with the cache key below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Docs-only change?
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: .github/docs-only.sh
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: '20'
      - name: Install
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci || npm install
      - name: Playwright version
        if: steps.scope.outputs.docs_only != 'true'
        id: pw
        run: |
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: steps.scope.outputs.docs_only != 'true'
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The runner image is in the key: browsers cached on one Ubuntu release
          # link against libraries another release may not ship.
          key: playwright-cw-${{ runner.os }}-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and WebKit
        if: steps.scope.outputs.docs_only != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Chromium and WebKit system deps
        if: steps.scope.outputs.docs_only != 'true' && steps.cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit
      - name: Click-through checks
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run test:browser
